<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 249" width="568" height="249" font-family="'Google Sans Code', 'Adwaita Mono', 'DejaVu Sans Mono', monospace" font-size="12">
<style>
.frame{fill:#ffffff;stroke:#e4e4e7;stroke-width:1}.caption{fill:#09090b;font-size:14.5px;font-weight:700;letter-spacing:.02em}.zone{fill:#f4f4f5;stroke:#e4e4e7;stroke-width:1}.node{fill:#d7d7d8;stroke:#71717b;stroke-width:1}.solid{fill:#09090b;stroke:#09090b;stroke-width:1}.dashed{fill:#ffffff;stroke:#71717b;stroke-width:1;stroke-dasharray:4 3}.dotted{fill:#ffffff;stroke:#71717b;stroke-width:1;stroke-dasharray:1 3;stroke-linecap:round}.flow{fill:none;stroke:#71717b;stroke-width:1}.head{fill:#71717b;stroke:none}.label{fill:#09090b}.inverse{fill:#ffffff}
@media (prefers-color-scheme: dark){.frame{fill:#09090b;stroke:#2e2e2e;stroke-width:1}.caption{fill:#fafafa;font-size:14.5px;font-weight:700;letter-spacing:.02em}.zone{fill:#27272a;stroke:#2e2e2e;stroke-width:1}.node{fill:#2f2f31;stroke:#9f9fa9;stroke-width:1}.solid{fill:#fafafa;stroke:#fafafa;stroke-width:1}.dashed{fill:#09090b;stroke:#9f9fa9;stroke-width:1;stroke-dasharray:4 3}.dotted{fill:#09090b;stroke:#9f9fa9;stroke-width:1;stroke-dasharray:1 3;stroke-linecap:round}.flow{fill:none;stroke:#9f9fa9;stroke-width:1}.head{fill:#9f9fa9;stroke:none}.label{fill:#fafafa}.inverse{fill:#09090b}}
</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7Z" class="head"/></marker></defs>
<rect x="0.5" y="0.5" width="567" height="248" class="frame"/>
<text x="24" y="32.5" class="caption">how a token is issued and retired</text>
<g transform="translate(24 43)">
<rect x="18" y="24" width="108" height="64" class="node"/>
<text x="72.0" y="44.4" text-anchor="middle" class="label">1</text>
<text x="72.0" y="60" text-anchor="middle" class="label">client asks</text>
<text x="72.0" y="75.6" text-anchor="middle" class="label">for a token</text>
<polyline points="126,56 143,56" class="flow" marker-end="url(#head)"/>
<rect x="143" y="24" width="108" height="64" class="node"/>
<text x="197.0" y="36.6" text-anchor="middle" class="label">2</text>
<text x="197.0" y="52.2" text-anchor="middle" class="label">issuer mints</text>
<text x="197.0" y="67.8" text-anchor="middle" class="label">a short-lived</text>
<text x="197.0" y="83.4" text-anchor="middle" class="label">token</text>
<polyline points="251,56 268,56" class="flow" marker-end="url(#head)"/>
<rect x="268" y="24" width="108" height="64" class="node"/>
<text x="322.0" y="36.6" text-anchor="middle" class="label">3</text>
<text x="322.0" y="52.2" text-anchor="middle" class="label">proxy swaps</text>
<text x="322.0" y="67.8" text-anchor="middle" class="label">it for the</text>
<text x="322.0" y="83.4" text-anchor="middle" class="label">real key</text>
<polyline points="376,56 393,56" class="flow" marker-end="url(#head)"/>
<rect x="393" y="24" width="108" height="64" class="node"/>
<text x="447.0" y="44.4" text-anchor="middle" class="label">4</text>
<text x="447.0" y="60" text-anchor="middle" class="label">token</text>
<text x="447.0" y="75.6" text-anchor="middle" class="label">expires</text>
<text x="18" y="130" text-anchor="start" class="label">the real key never leaves the proxy.</text>
<text x="18" y="150" text-anchor="start" class="label">what shows in logs is the short-lived token.</text>
</g></svg>
